<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>evaluations · celestebench</title><link rel="stylesheet" href="/viewer.css"></head>
<body>
<header><h1><a href="/">celestebench</a></h1><span id="pollError" role="status"></span><nav><a href="/runs">runs</a><a href="/evals" aria-current="page">evaluations</a><a href="/leaderboard">leaderboard</a><button id="newEvalToggle" aria-expanded="false" aria-haspopup="dialog" aria-controls="evalOverlay">new eval</button></nav></header>
<div id="evalOverlay" hidden>
  <form id="evalForm" autocomplete="off" onsubmit="return submitEval(event)">
    <div id="evalDialog" role="dialog" aria-modal="true" aria-label="new evaluation">
      <div class="dlg-head"><h2>new evaluation</h2><button type="button" id="evalClose" aria-label="close">✕</button></div>
      <div class="dlg-body">
        <div class="col">
          <div id="runHeader" class="run-row run-head" hidden></div>
          <div id="runRows"></div>
          <button type="button" id="addRun" title="Duplicate the last row's settings with an empty model">+ add run</button>
        </div>
        <div class="col">
          <div class="formgrid">
            <label>harness <select id="evalHarness"></select></label>
            <label>mode <select id="evalMode"></select></label>
          </div>
          <div id="harnessFields"></div>
        </div>
      </div>
      <div class="dlg-foot"><span id="evalError"></span><button id="evalSubmit" type="submit" disabled>launch eval</button></div>
    </div>
  </form>
</div>
<main id="evalPage"><section><h2>evaluations</h2><div id="evalJobs" class="meta">loading…</div></section></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
let evalJobs = [], polling = false, harnesses = {}, modes = [], selected = null;
const cards = new Map();

async function jsonRequest(url, options = {}) {
  const signal = options.timeout ? AbortSignal.timeout(options.timeout) : undefined;
  const response = await fetch(url, {...options, signal});
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw Error(data.error || `Request failed (${response.status})`);
  return data;
}
function jobMeta(job) {
  const second = job.status === "queued" ? "waiting to start"
    : job.status === "running" && job.engine === false ? "harness booting — game clock has not started"
    : `${Number(job.elapsed).toFixed(1)}/${Number(job.timeout || 0).toFixed(0)}s · ${job.tokens == null ? "—" : job.tokens} tokens`;
  const mode = job.mode ? `${String(job.mode).toUpperCase()} · ` : "";
  return [`${job.decisions} decisions · ${job.frames} frames`, mode + second];
}
function updateMeta(card, job) {
  const [frames, detail] = jobMeta(job);
  card.querySelector(".eval-frames").textContent = frames;
  card.querySelector(".eval-detail").textContent = detail;
}

/* Each running card refreshes its own frame with short PNG requests, so any
   number of live cards can fit in the browser's per-host connection budget. */
function pollLive(img) {
  if (!img.isConnected) return;
  img.onload = img.onerror = () => setTimeout(() => pollLive(img), 200);
  img.src = "/frame/" + encodeURIComponent(img.dataset.run) + "?t=" + Date.now();
}
function buildCard(job) {
  const card = document.createElement("div");
  card.className = "card";
  const open = job.run_ready !== false;
  const title = open ? `<a class="button" href="/runs?run=${encodeURIComponent(job.name)}">${esc(job.model)}</a>`
    : `<span>${esc(job.model)}</span>`;
  card.innerHTML = `${title}
    <div class="eval-status ${esc(job.status)}">${esc(job.status)}</div>
    <div class="meta"><span class="eval-frames"></span><br><span class="eval-detail"></span></div>
    ${["running", "completed"].includes(job.status) ? `<progress max="${job.timeout || job.elapsed || 1}" value="${job.elapsed}" aria-label="evaluation progress"></progress>` : ""}
    ${job.status === "running" ? `<img class="eval-live" data-run="${esc(job.name)}" alt="live game stream for ${esc(job.model)}">` : ""}
    ${job.error ? (job.error.length > 120
      ? `<details class="eval-error"><summary>${esc(job.error.slice(0, 120))}…</summary><pre>${esc(job.error)}</pre></details>`
      : `<div class="eval-error">${esc(job.error)}</div>`) : ""}`;
  updateMeta(card, job);
  const live = card.querySelector(".eval-live");
  if (live) setTimeout(() => pollLive(live), 0);
  if (job.status === "running" || job.status === "queued") {
    const stop = document.createElement("button");
    stop.textContent = "stop";
    stop.onclick = async () => {
      stop.disabled = true;
      try {
        await jsonRequest("/api/evals/" + job.id + "/stop", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
        await poll();
      } catch (error) { $("pollError").textContent = error.message; stop.disabled = false; }
    };
    card.appendChild(stop);
  }
  return card;
}

function updateCard(card, job) {
  updateMeta(card, job);
  const progress = card.querySelector("progress");
  if (progress) { progress.max = job.timeout || job.elapsed || 1; progress.value = job.elapsed; }
}

function renderEvalJobs() {
  const box = $("evalJobs");
  for (const [id, card] of cards)
    if (!evalJobs.some(job => job.id === id)) { card.remove(); cards.delete(id); }
  if (!evalJobs.length) { box.textContent = "no evaluations running"; return; }
  if (!box.children.length) box.textContent = "";
  const ordered = [];
  for (const job of evalJobs) {
    const shape = job.status + (job.error ? "!" : "") + (job.run_ready === false ? "0" : "1");
    let card = cards.get(job.id);
    if (!card || card.dataset.shape !== shape) {
      if (card) card.remove();
      card = buildCard(job);
      card.dataset.shape = shape;
      cards.set(job.id, card);
    } else updateCard(card, job);
    ordered.push(card);
  }
  let ref = box.firstElementChild;
  for (const card of ordered) {
    if (card === ref) { ref = card.nextElementSibling; continue; }
    box.insertBefore(card, ref);
  }
}
async function poll() {
  if (polling) return;
  polling = true;
  try {
    evalJobs = (await jsonRequest("/api/evals", {timeout: 10000})).filter(job => ["queued", "running"].includes(job.status));
    renderEvalJobs();
    updateEvalPlan();
    if ($("pollError").textContent.startsWith("Refresh failed:")) $("pollError").textContent = "";
  } catch (error) { $("pollError").textContent = `Refresh failed: ${error.message}`; }
  finally { polling = false; }
}

/* The new-eval form is built from /api/harnesses, so a new external harness
   only needs a backend entry: no change here or in the launch code. */
const optionsOf = field => field.choices.map(choice => typeof choice === "string"
  ? {value: choice, label: choice} : choice);
function control(field, value) {
  let input;
  if (field.kind === "choice") {
    input = document.createElement("select");
    for (const choice of optionsOf(field)) {
      const option = document.createElement("option");
      option.value = choice.value; option.textContent = choice.label;
      input.append(option);
    }
    if (value != null && value !== "") input.value = value;
  } else if (field.kind === "bool") {
    input = document.createElement("input");
    input.type = "checkbox"; input.checked = !!value;
  } else if (field.kind === "textarea") {
    input = document.createElement("textarea");
    input.rows = 6; input.spellcheck = false;
    if (value != null) input.value = value;
  } else {
    input = document.createElement("input");
    input.type = field.kind === "secret" ? "password"
      : field.kind === "int" || field.kind === "number" ? "number" : "text";
    if (input.type === "number" && field.minimum != null) input.min = field.minimum;
    if (value != null) input.value = value;
    input.autocapitalize = "off"; input.spellcheck = false;
  }
  input.dataset.key = field.key;
  if (field.help) input.title = field.help;
  if (field.kind === "secret") {
    input.classList.add("secret");
    input.readOnly = true; input.autocomplete = "off";
    input.onfocus = () => input.removeAttribute("readonly");
  }
  if (field.key === "model") input.placeholder = "model, e.g. qwen3.8-flash";
  return input;
}
function readControl(input, field) {
  if (field.kind === "bool") return input.checked;
  const value = input.value.trim();
  if (value === "") return null;
  return field.kind === "int" || field.kind === "number" ? +value : value;
}
function globalField(field) {
  const label = document.createElement("label");
  if (field.kind === "textarea") label.className = "wide";
  label.textContent = field.label;
  label.append(control(field, field.default));
  if (field.when) label.dataset.when = JSON.stringify(field.when);
  return label;
}
function applyWhen() {
  for (const label of document.querySelectorAll("#harnessFields label[data-when]")) {
    const [key, want] = JSON.parse(label.dataset.when);
    const source = document.querySelector(`#harnessFields [data-key="${key}"]`);
    const value = source && source.type === "checkbox" ? String(source.checked) : source && source.value;
    label.hidden = !source || value !== want;
  }
}
function renderFields() {
  const box = $("harnessFields");
  box.replaceChildren();
  const plain = selected.options.filter(field => !field.advanced);
  const advanced = selected.options.filter(field => field.advanced);
  const grid = document.createElement("div");
  grid.className = "formgrid";
  plain.forEach(field => grid.append(globalField(field)));
  box.append(grid);
  if (advanced.length) {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "advanced";
    const inner = document.createElement("div");
    inner.className = "formgrid";
    advanced.forEach(field => inner.append(globalField(field)));
    details.append(summary, inner);
    box.append(details);
  }
  if (selected.note) {
    const note = document.createElement("div");
    note.className = "meta"; note.textContent = selected.note;
    box.append(note);
  }
  applyWhen();
}
function runRow(model = "", values = null) {
  const row = document.createElement("div");
  row.className = "run-row";
  row.style.gridTemplateColumns = `repeat(${selected.run.length}, minmax(0, 1fr)) auto`;
  for (const field of selected.run) {
    const value = values && field.key in values ? values[field.key]
      : field.key === "model" ? model : field.default;
    row.append(control(field, value));
  }
  const remove = document.createElement("button");
  remove.type = "button"; remove.className = "rm"; remove.textContent = "✕";
  remove.setAttribute("aria-label", "remove this run");
  remove.onclick = () => { row.remove(); updateEvalPlan(); };
  row.append(remove);
  return row;
}
function rowValues(row) {
  const values = {};
  for (const input of row.querySelectorAll("[data-key]")) {
    const field = selected.run.find(item => item.key === input.dataset.key);
    const value = readControl(input, field);
    if (value != null) values[input.dataset.key] = value;
  }
  return values;
}
function runRows() {
  return [...document.querySelectorAll("#runRows .run-row")].map(rowValues);
}
function renderHeader() {
  const head = $("runHeader");
  head.replaceChildren(...selected.run.map(field => {
    const span = document.createElement("span");
    span.textContent = field.label;
    return span;
  }));
  head.style.gridTemplateColumns = `repeat(${selected.run.length}, minmax(0, 1fr)) auto`;
}
function rerenderRows() {
  const values = [...document.querySelectorAll("#runRows .run-row")].map(rowValues);
  $("runRows").replaceChildren(...(values.length ? values : [{}]).map(v => runRow("", v)));
  syncRows();
}
function selectHarness() {
  selected = harnesses[$("evalHarness").value];
  if (!selected) return;
  renderHeader();
  renderFields();
  rerenderRows();
}
function syncRows() {
  if (!selected) return;
  const rows = runRows();
  $("runHeader").hidden = !rows.length;
  const submit = $("evalSubmit");
  submit.disabled = !rows.some(row => row.model);
  submit.textContent = rows.length <= 1 ? "launch eval" : `launch ${rows.length} evals`;
}
function updateEvalPlan() { syncRows(); }
function addRun() {
  const last = $("runRows").lastElementChild;
  if (last && !last.querySelector('[data-key="model"]').value.trim()) return;
  const values = last ? rowValues(last) : {};
  values.model = "";
  const copy = runRow("", values);
  $("runRows").append(copy);
  copy.querySelector('[data-key="model"]').focus();
  syncRows();
}
function openEval() {
  $("evalOverlay").hidden = false;
  $("newEvalToggle").setAttribute("aria-expanded", "true");
  if (!$("runRows").children.length) $("runRows").append(runRow());
  updateEvalPlan();
  const first = $("runRows").firstElementChild.querySelector('[data-key="model"]');
  if (first && !first.value) first.focus();
}
function closeEval() {
  $("evalOverlay").hidden = true;
  $("newEvalToggle").setAttribute("aria-expanded", "false");
}
async function submitEval(event) {
  event.preventDefault();
  const button = $("evalSubmit"), error = $("evalError");
  button.disabled = true; error.textContent = "";
  const body = {harness: selected.key, mode: $("evalMode").value, evals: runRows()};
  for (const input of document.querySelectorAll("#harnessFields [data-key]")) {
    if (input.closest("label").hidden) continue;
    const field = selected.options.find(item => item.key === input.dataset.key);
    const value = readControl(input, field);
    if (value != null) body[field.key] = value;
  }
  try {
    await jsonRequest("/api/evals", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    for (const input of document.querySelectorAll('#harnessFields [data-key="api_key"]')) input.value = "";
    closeEval();
    await poll();
  } catch (failure) { error.textContent = failure.message; }
  updateEvalPlan();
  return false;
}
async function loadHarnesses() {
  try {
    const data = await jsonRequest("/api/harnesses", {timeout: 10000});
    for (const harness of data.harnesses) harnesses[harness.key] = harness;
    modes = data.modes;
    const select = $("evalHarness");
    select.replaceChildren(...Object.values(harnesses).map(harness => {
      const option = document.createElement("option");
      option.value = harness.key; option.textContent = harness.label;
      return option;
    }));
    select.value = "tau";
    $("evalMode").replaceChildren(...modes.map(mode => {
      const option = document.createElement("option");
      option.value = mode.name; option.textContent = mode.label;
      option.title = mode.description || "";
      return option;
    }));
    selectHarness();
  } catch (error) { $("pollError").textContent = `Could not load harnesses: ${error.message}`; }
}
$("newEvalToggle").onclick = () => $("evalOverlay").hidden ? openEval() : closeEval();
$("evalClose").onclick = closeEval;
$("evalOverlay").onclick = event => { if (event.target === $("evalOverlay")) closeEval(); };
document.addEventListener("keydown", event => { if (event.key === "Escape" && !$("evalOverlay").hidden) closeEval(); });
$("evalHarness").onchange = selectHarness;
$("harnessFields").addEventListener("input", applyWhen);
$("harnessFields").addEventListener("change", applyWhen);
$("runRows").addEventListener("input", updateEvalPlan);
$("addRun").onclick = addRun;
loadHarnesses();
poll();
setInterval(poll, 2000);
</script></body></html>
