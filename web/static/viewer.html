<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>celestebench</title><link rel="stylesheet" href="/viewer.css"></head>
<body>
<header><h1><a href="/">celestebench</a></h1><select id="run" aria-label="run"></select><span id="meta" class="meta"></span><button id="liveSound" type="button" aria-pressed="false" hidden>sound</button><button id="deleteRun" class="danger" type="button" disabled>delete run</button><span id="pollError" role="status"></span><nav><a href="/" aria-current="page">runs</a><a href="/evals">evaluations</a></nav></header>
<main>
<aside id="list"></aside>
<section>
  <video id="video" controls></video>
  <img id="liveFrame" alt="live frame" style="display:none;width:512px;height:512px;image-rendering:pixelated;background:#000">
  <div id="timeline"><div id="playhead"></div></div>
  <div id="clock">0.0 / 0.0 s</div>
</section>
<section id="panel"></section>
</main>
<script src="/live-audio.js"></script><script>
const $ = id => document.getElementById(id);
const video = $("video");
const BITS = ["LEFT", "RIGHT", "UP", "DOWN", "O", "X"];
const buttons = m => m === 0 ? "release" : BITS.filter((_, i) => m & (1 << i)).join("+");
const actionName = action => action.wait ? "wait" : buttons(action.buttons);
let runs = [], decisions = [], shown = null, raf = null, pinned = false, request = 0, selectedRun = null, loadedStatus = null, polling = false;
const status = d => {
  if (!d.actions.length) return d.status === "played" ? "not executed" : (d.status || "not executed").replaceAll("_", " ");
  if (d.status && !["played", "executed"].includes(d.status)) return d.status.replaceAll("_", " ");
  return video.getAttribute("src") && video.currentTime < d.actions[0].t0 ? "upcoming" : "played";
};

function draw() {
  if (!video.getAttribute("src")) { raf = null; return; }
  const p = video.currentTime / (video.duration || 1);
  $("playhead").style.left = (p * 100) + "%";
  $("clock").textContent = video.currentTime.toFixed(1) + " / " + (video.duration || 0).toFixed(1) + " s";
  const d = decisions.findLast(x => x.from <= video.currentTime + 0.01);
  if (!pinned && d !== shown) show(d);
  const state = $("state");
  if (state && shown) state.textContent = status(shown);
  raf = video.paused ? null : requestAnimationFrame(draw);
}
video.addEventListener("play", () => { pinned = false; if (!raf) draw(); });
video.addEventListener("seeked", () => { if (!raf) draw(); });
video.addEventListener("timeupdate", () => { if (!raf) draw(); });

function show(d) {
  shown = d;
  document.querySelectorAll("#list .row").forEach((r, i) => r.classList.toggle("current", decisions[i] === d));
  if (d) d.node.scrollIntoView({ block: "nearest" });
  const p = $("panel");
  if (!d) { p.innerHTML = ""; return; }
  if (!("live" in $("liveFrame").dataset) && !video.getAttribute("src") && d.screenshot && /^(data:image\/|\/screenshot\/)/.test(d.screenshot)) {
    $("liveFrame").src = d.screenshot;
    $("liveFrame").style.display = "block";
    $("clock").textContent = `observation #${d.decision} · ${d.from.toFixed(1)}s game time`;
  }
  const acts = d.actions.map(a => `<span class="act">${actionName(a)}</span> &times; ${a.frames}f`).join(", ") || "none";
  const state = status(d);
  let html = `<div class="card"><h3>decision ${d.decision} @ ${d.t.toFixed(1)}s &middot; think ${Number(d.latency || 0).toFixed(1)}s &middot; <span class="meta" id="state">${esc(state)}</span></h3>
    ${d.screenshot && /^(data:image\/(png|jpeg|webp);base64,|\/screenshot\/)/.test(d.screenshot) ? `<img src="${esc(d.screenshot)}" title="what the model saw">` : ""}
    <p class="meta">played: ${acts}</p></div>`;
  if (d.thinking) html += `<div class="card"><h3>CoT</h3><div class="thinking">${esc(d.thinking)}</div></div>`;
  if (d.error) html += `<div class="card"><h3>${esc(status(d))}</h3><pre>${esc(d.error)}</pre></div>`;
  if (d.text) html += `<div class="card"><h3>reply</h3><div class="reply">${esc(d.text)}</div></div>`;
  if (d.tool) html += `<div class="card"><h3>tool call</h3><pre>${esc(JSON.stringify(d.tool))}</pre></div>`;
  p.innerHTML = html;
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

function selectDecision(d) {
  if (!d.actions.length || !video.currentSrc || !video.duration) {
    pinned = true;
    video.pause();
    if (video.currentSrc) video.currentTime = Math.min(d.from, Math.max(0, (video.duration || 0) - 0.01));
    show(d);
  } else {
    pinned = false;
    video.currentTime = d.t + 0.01;
    video.play().catch(() => show(d));
  }
}

function buildTimeline(duration) {
  const tl = $("timeline");
  tl.querySelectorAll(".bar").forEach(b => b.remove());
  for (const d of decisions) for (const a of (d.actions.length ? d.actions : [{t0: d.from, t1: d.from}])) {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.left = Math.min(99.6, a.t0 / duration * 100) + "%";
    bar.style.width = Math.max((a.t1 - a.t0) / duration * 100, 0.4) + "%";
    bar.style.background = !d.actions.length ? "#986c3a" : a.buttons ? `hsl(${a.buttons * 137 % 360} 55% 45%)` : "#3a3a3a";
    bar.title = `#${d.decision} @ ${a.t0.toFixed(1)}s  ${d.actions.length ? actionName(a) + " × " + a.frames + "f" : status(d)}`;
    bar.onclick = e => { e.stopPropagation(); if (!d.actions.length || !video.getAttribute("src")) selectDecision(d); else { pinned = false; video.currentTime = a.t0 + 0.01; } };
    tl.appendChild(bar);
  }
}
function buildList() {
  const list = $("list");
  list.innerHTML = "";
  for (const d of decisions) {
    const row = document.createElement("div");
    row.className = "row";
    row.textContent = `#${d.decision} @ ${d.t.toFixed(1)}s  ${d.actions.map(actionName).join(",") || status(d)}`;
    row.onclick = () => selectDecision(d);
    d.node = row;
    list.appendChild(row);
  }
}

async function jsonRequest(url, options) {
  const response = await fetch(url, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw Error(data.error || `Request failed (${response.status})`);
  return data;
}
function attachVideo(run) {
  const liveFrame = $("liveFrame");
  $("liveSound").hidden = run.status !== "running";
  if (run.status === "running") syncLiveSound($("liveSound"), run.name);
  else stopLiveSound(run.name);
  if (run.status === "running") {
    video.style.display = "none";
    if (video.hasAttribute("src")) { video.removeAttribute("src"); video.load(); }
    liveFrame.dataset.live = "";
    const source = "/live/" + encodeURIComponent(run.name);
    if (liveFrame.getAttribute("src") !== source) liveFrame.src = source;
    liveFrame.style.display = "block";
  } else if (run.video) {
    if (video.getAttribute("src") !== run.video) {
      video.src = run.video;
      video.load();
    }
    video.style.display = "block";
    liveFrame.style.display = "none";
    liveFrame.removeAttribute("src");
    delete liveFrame.dataset.live;
  } else {
    video.style.display = "none";
    if (video.hasAttribute("src")) { video.removeAttribute("src"); video.load(); }
    liveFrame.style.display = "none";
    liveFrame.removeAttribute("src");
    delete liveFrame.dataset.live;
  }
}
async function loadRun(name) {
  const run = runs.find(r => r.name === name);
  if (!run) return;
  if (selectedRun && selectedRun !== name) stopLiveSound(selectedRun);
  const id = ++request;
  selectedRun = name;
  loadedStatus = run.status;
  $("run").value = name;
  $("deleteRun").disabled = ["running", "queued"].includes(run.status);
  video.pause();
  pinned = false;
  decisions = []; shown = null;
  $("liveFrame").removeAttribute("src");
  $("liveFrame").style.display = "none";
  $("clock").textContent = "waiting for observation";
  $("meta").textContent = run.model;
  attachVideo(run);
  buildList(); buildTimeline(1); show(null);
  const data = await jsonRequest("/api/run/" + encodeURIComponent(name));
  if (id !== request) return;
  decisions = data.decisions;
  buildList(); buildTimeline(run.duration || decisions.at(-1)?.t || 1);
  if (!run.video && decisions.length) show(decisions.at(-1));
  else draw();
}
function renderRuns() {
  const sel = $("run");
  const signature = JSON.stringify(runs.map(r => [r.name, r.duration, r.status]));
  if (sel.dataset.signature === signature) return;
  sel.dataset.signature = signature;
  sel.innerHTML = "";
  const groups = new Map();
  for (const run of runs) {
    if (!groups.has(run.model)) {
      const group = document.createElement("optgroup");
      group.label = run.model;
      groups.set(run.model, group);
      sel.appendChild(group);
    }
    const option = document.createElement("option");
    option.value = run.name;
    option.textContent = `${run.name.split("/").at(-1)} (${["running", "queued"].includes(run.status) ? run.status : Number(run.duration || 0).toFixed(0) + "s"})`;
    groups.get(run.model).appendChild(option);
  }
  if (selectedRun) sel.value = selectedRun;
}
async function poll() {
  if (polling) return;
  polling = true;
  try {
    runs = await jsonRequest("/api/runs");
    renderRuns();
    const run = runs.find(r => r.name === selectedRun);
    if (run && (run.status === "running" || loadedStatus === "running" || (run.video && !video.getAttribute("src")))) {
      await refreshSelectedRun(run);
    }
    $("pollError").textContent = "";
  } catch (error) { $("pollError").textContent = `Refresh failed: ${error.message}`; }
  finally { polling = false; }
}
async function refreshSelectedRun(run) {
  const id = request;
  const data = await jsonRequest("/api/run/" + encodeURIComponent(run.name));
  if (id !== request || run.name !== selectedRun) return;
  const oldShown = shown?.decision;
  const wasLive = !video.getAttribute("src");
  decisions = data.decisions;
  loadedStatus = run.status;
  attachVideo(run);
  buildList(); buildTimeline(run.duration || decisions.at(-1)?.t || 1);
  if (wasLive && run.video) pinned = true;
  if (!run.video) show(decisions.at(-1));
  else if (oldShown != null) show(decisions.find(d => d.decision === oldShown));
  else if (run.video) draw();
}
async function init() {
  await poll();
  $("run").onchange = () => {
    const name = $("run").value;
    history.pushState(null, "", "/?run=" + encodeURIComponent(name));
    loadRun(name).catch(reportError);
  };
  const requested = new URLSearchParams(location.search).get("run");
  const initial = runs.find(r => r.name === requested)?.name || runs[0]?.name;
  if (initial) {
    if (initial !== requested) history.replaceState(null, "", "/?run=" + encodeURIComponent(initial));
    await loadRun(initial);
  }
  setInterval(poll, 2000);
}
$("deleteRun").onclick = async () => {
  const name = selectedRun;
  if (!name || !confirm(`Delete run "${name}" and all its files? This cannot be undone.`)) return;
  const index = runs.findIndex(run => run.name === name);
  $("deleteRun").disabled = true;
  try {
    await jsonRequest("/api/run/" + encodeURIComponent(name), {method:"DELETE"});
    runs = await jsonRequest("/api/runs");
    selectedRun = null;
    renderRuns();
    const next = runs[Math.min(index, runs.length - 1)];
    if (next) {
      history.replaceState(null, "", "/?run=" + encodeURIComponent(next.name));
      await loadRun(next.name);
    } else {
      history.replaceState(null, "", "/");
      video.pause(); video.removeAttribute("src"); video.load();
      $("run").innerHTML = ""; $("meta").textContent = ""; $("list").innerHTML = "";
      $("panel").innerHTML = ""; $("timeline").querySelectorAll(".bar").forEach(bar => bar.remove());
      $("clock").textContent = "no runs";
    }
    $("pollError").textContent = "";
  } catch (error) { $("pollError").textContent = error.message; $("deleteRun").disabled = false; }
};
$("liveSound").onclick = () => toggleLiveSound($("liveSound"), selectedRun);
window.onpopstate = () => {
  const name = new URLSearchParams(location.search).get("run");
  if (runs.some(run => run.name === name)) loadRun(name).catch(reportError);
};
$("timeline").onclick = e => {
  if (!video.getAttribute("src")) return;
  pinned = false;
  const x = e.offsetX / $("timeline").clientWidth;
  video.currentTime = x * (video.duration || 0);
};
function reportError(error) { $("panel").innerHTML = `<div class="card meta">${esc(error.message)}</div>`; }
init().catch(reportError);
</script></body></html>
