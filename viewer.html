<!doctype html>
<html><head><meta charset="utf-8"><title>celestebench</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.5 ui-monospace, monospace; background: #111; color: #ccc; height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid #333; flex: none; }
h1 { font-size: 15px; margin: 0; color: #eee; }
select { background: #1a1a1a; color: #ccc; border: 1px solid #444; padding: 4px 8px; font: inherit; }
main { display: grid; grid-template-columns: 260px 544px 1fr; gap: 16px; padding: 16px; flex: 1; min-height: 0; }
section, aside { overflow-y: auto; overflow-x: hidden; }
video { width: 512px; height: 512px; image-rendering: pixelated; background: #000; display: block; }
#timeline { position: relative; height: 34px; background: #1a1a1a; border: 1px solid #333; margin-top: 6px; cursor: crosshair; overflow: hidden; }
.bar { position: absolute; top: 9px; height: 14px; border-radius: 2px; cursor: pointer; }
.bar:hover { filter: brightness(1.5); }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #f55; pointer-events: none; }
#clock { margin-top: 4px; color: #999; }
#list .row { padding: 6px 8px; border-bottom: 1px solid #222; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#list .row:hover { background: #1d241d; }
#list .row.current { background: #243224; color: #cfc; }
#panel .card { border: 1px solid #333; padding: 10px; margin-bottom: 12px; }
#panel img { width: 128px; height: 128px; image-rendering: pixelated; display: block; }
#panel h3 { margin: 0 0 8px; font-size: 13px; color: #eee; }
#panel p { margin: 0; }
#panel pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
.thinking { white-space: pre-wrap; word-break: break-word; color: #a8c; background: #191420; padding: 8px; border-left: 2px solid #63c; }
.reply { white-space: pre-wrap; word-break: break-word; color: #bbb; background: #181818; padding: 8px; border-left: 2px solid #666; }
.act { color: #7d7; }
.meta { color: #888; }
</style></head>
<body>
<header><h1>celestebench</h1><select id="run"></select><span id="meta" class="meta"></span></header>
<main>
<aside id="list"></aside>
<section>
  <video id="video" controls></video>
  <div id="timeline"><div id="playhead"></div></div>
  <div id="clock">0.0 / 0.0 s</div>
</section>
<section id="panel"></section>
</main>
<script>
const $ = id => document.getElementById(id);
const video = $("video");
const BITS = ["LEFT", "RIGHT", "UP", "DOWN", "O", "X"];
const buttons = m => m === 0 ? "release" : BITS.filter((_, i) => m & (1 << i)).join("+");
let runs = [], decisions = [], shown = null, raf = null, pinned = false, request = 0;
const status = d => {
  if (!d.actions.length) return d.status === "played" ? "not executed" : (d.status || "not executed").replaceAll("_", " ");
  if (d.status && !["played", "executed"].includes(d.status)) return d.status.replaceAll("_", " ");
  return video.currentTime < d.actions[0].t0 ? "upcoming" : "played";
};

function draw() {
  const p = video.currentTime / (video.duration || 1);
  $("playhead").style.left = (p * 100) + "%";
  $("clock").textContent = video.currentTime.toFixed(1) + " / " + (video.duration || 0).toFixed(1) + " s";
  const d = decisions.findLast(x => x.from <= video.currentTime + 0.01);
  if (!pinned && d !== shown) show(d);
  const state = $("state");
  if (state && shown) state.textContent = status(shown);
  raf = video.paused ? null : requestAnimationFrame(draw);
}
video.addEventListener("play", () => { pinned = false; if (!raf) draw(); });
video.addEventListener("seeked", () => { if (!raf) draw(); });
video.addEventListener("timeupdate", () => { if (!raf) draw(); });

function show(d) {
  shown = d;
  document.querySelectorAll("#list .row").forEach((r, i) => r.classList.toggle("current", decisions[i] === d));
  if (d) d.node.scrollIntoView({ block: "nearest" });
  const p = $("panel");
  if (!d) { p.innerHTML = ""; return; }
  const acts = d.actions.map(a => `<span class="act">${buttons(a.buttons)}</span> &times; ${a.frames}f`).join(", ") || "none";
  const state = status(d);
  let html = `<div class="card"><h3>decision ${d.decision} @ ${d.t.toFixed(1)}s &middot; think ${Number(d.latency || 0).toFixed(1)}s &middot; <span class="meta" id="state">${esc(state)}</span></h3>
    ${d.screenshot && /^(data:image\/(png|jpeg|webp);base64,|\/screenshot\/)/.test(d.screenshot) ? `<img src="${esc(d.screenshot)}" title="what the model saw">` : ""}
    <p class="meta">played: ${acts}</p></div>`;
  if (d.thinking) html += `<div class="card"><h3>CoT</h3><div class="thinking">${esc(d.thinking)}</div></div>`;
  if (d.error) html += `<div class="card"><h3>${esc(status(d))}</h3><pre>${esc(d.error)}</pre></div>`;
  if (d.text) html += `<div class="card"><h3>reply</h3><div class="reply">${esc(d.text)}</div></div>`;
  if (d.tool) html += `<div class="card"><h3>tool call</h3><pre>${esc(JSON.stringify(d.tool))}</pre></div>`;
  p.innerHTML = html;
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

function selectDecision(d) {
  if (!d.actions.length) {
    pinned = true;
    video.pause();
    if (video.currentSrc) video.currentTime = Math.min(d.from, Math.max(0, (video.duration || 0) - 0.01));
    show(d);
  } else {
    pinned = false;
    video.currentTime = d.t + 0.01;
    video.play().catch(() => show(d));
  }
}

function buildTimeline(duration) {
  const tl = $("timeline");
  tl.querySelectorAll(".bar").forEach(b => b.remove());
  for (const d of decisions) for (const a of (d.actions.length ? d.actions : [{t0: d.from, t1: d.from}])) {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.left = Math.min(99.6, a.t0 / duration * 100) + "%";
    bar.style.width = Math.max((a.t1 - a.t0) / duration * 100, 0.4) + "%";
    bar.style.background = !d.actions.length ? "#986c3a" : a.buttons ? `hsl(${a.buttons * 137 % 360} 55% 45%)` : "#3a3a3a";
    bar.title = `#${d.decision} @ ${a.t0.toFixed(1)}s  ${d.actions.length ? buttons(a.buttons) + " × " + a.frames + "f" : status(d)}`;
    bar.onclick = e => { e.stopPropagation(); if (!d.actions.length) selectDecision(d); else { pinned = false; video.currentTime = a.t0 + 0.01; } };
    tl.appendChild(bar);
  }
}
function buildList() {
  const list = $("list");
  list.innerHTML = "";
  for (const d of decisions) {
    const row = document.createElement("div");
    row.className = "row";
    row.textContent = `#${d.decision} @ ${d.t.toFixed(1)}s  ${d.actions.map(a => buttons(a.buttons)).join(",") || status(d)}`;
    row.onclick = () => selectDecision(d);
    d.node = row;
    list.appendChild(row);
  }
}

async function loadRun(name) {
  const id = ++request;
  const run = runs.find(r => r.name === name);
  video.pause();
  pinned = false;
  $("meta").textContent = run.model;
  decisions = []; shown = null;
  if (run.video) video.src = run.video;
  else video.removeAttribute("src");
  video.load();
  buildList(); buildTimeline(1); show(null);
  const response = await fetch("/api/run/" + encodeURIComponent(name));
  if (!response.ok) throw Error(`Could not load run (${response.status})`);
  const data = await response.json();
  if (id !== request) return;
  decisions = data.decisions;
  $("meta").textContent = run.model;
  buildTimeline(run.duration || video.duration || 1); buildList(); show(null);
  if (!run.video && decisions.length) { pinned = true; show(decisions[0]); }
  draw();
}
async function init() {
  runs = await (await fetch("/api/runs")).json();
  const sel = $("run");
  const groups = new Map();
  for (const r of runs) {
    if (!groups.has(r.model)) {
      const group = document.createElement("optgroup");
      group.label = r.model;
      groups.set(r.model, group);
      sel.appendChild(group);
    }
    const o = document.createElement("option");
    o.value = r.name;
    const short = r.name.startsWith(r.model + "/") ? r.name.slice(r.model.length + 1) : r.name;
    o.textContent = `${short} (${Number(r.duration || 0).toFixed(0)}s)`;
    groups.get(r.model).appendChild(o);
  }
  sel.onchange = () => loadRun(sel.value).catch(reportError);
  if (runs.length) { sel.value = runs[0].name; await loadRun(runs[0].name); }
}
$("timeline").onclick = e => {
  pinned = false;
  const x = e.offsetX / $("timeline").clientWidth;
  video.currentTime = x * (video.duration || 0);
};
function reportError(error) { $("panel").innerHTML = `<div class="card meta">${esc(error.message)}</div>`; }
init().catch(reportError);
</script></body></html>
