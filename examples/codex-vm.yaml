minimumLimaVersion: 1.2.0
base: template://_images/debian-12

vmType: vz
arch: aarch64
cpus: 2
memory: 2GiB
disk: 6GiB
mounts: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
portForwards:
- guestPortRange: [1, 65535]
  ignore: true

provision:
- mode: system
  script: |
    #!/bin/bash
    set -euxo pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends ca-certificates nftables nodejs npm
    id bench >/dev/null 2>&1 || useradd --create-home --shell /bin/bash bench
    npm install --global @openai/codex@0.153.4

    bench_uid=$(id -u bench)
    {
      echo '#!/usr/sbin/nft -f'
      echo 'table inet celestebench {'
      echo '  chain output {'
      echo '    type filter hook output priority 0; policy accept;'
      echo "    meta skuid $bench_uid jump bench_output"
      echo '  }'
      echo '  chain bench_output {'
      echo '    oifname "lo" tcp dport 8124 accept'
      echo '    oifname "lo" meta l4proto { tcp, udp } th dport 53 accept'
      echo '    oifname "lo" reject'
      awk '/^nameserver / {print $2}' /etc/resolv.conf | while read -r resolver; do
        case "$resolver" in
          *:*) : ;;
          *)   echo "    ip daddr $resolver meta l4proto { tcp, udp } th dport 53 accept" ;;
        esac
      done
      echo '    ip daddr { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 } reject'
      echo '    ip6 daddr ::/0 reject'
      echo '    tcp dport 443 accept'
      echo '    reject'
      echo '  }'
      echo '}'
    } >/etc/nftables.celestebench
    nft list table inet celestebench >/dev/null 2>&1 && nft delete table inet celestebench
    nft -f /etc/nftables.celestebench
    cp /etc/nftables.celestebench /etc/nftables.conf
    systemctl enable --now nftables
    test "$(id -Gn bench)" = bench
    test "$(runuser -u bench -- codex --version)" = 'codex-cli 0.153.4'
    apt-get clean
    npm cache clean --force
    rm -rf /var/lib/apt/lists/*
